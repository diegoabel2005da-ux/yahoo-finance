# Render Blueprint — backend de la plataforma (FastAPI) conectado a Supabase.
services:
  - type: web
    name: plataforma-mx-api
    runtime: python
    plan: free
    region: oregon            # cercano a Supabase us-west-2
    branch: plataforma-mx
    rootDir: plataforma-mx/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL       # Supabase → Connect → Session pooler (puerto 5432). Se captura en Render, no en el repo.
        sync: false
      - key: REQUIRE_DATABASE_URL
        value: "1"
      - key: DB_SCHEMA
        value: plataforma
      - key: AUTO_SEED          # los datos ya están en Supabase
        value: "0"
      - key: CORS_ORIGINS
        value: https://plataforma-mx.onrender.com
      - key: ADMIN_TOKEN        # protege importaciones/actualizaciones; consúltelo en Render → Environment
        generateValue: true
      - key: BANXICO_TOKEN      # opcional: token del SIE para «Actualizar todos los datos»
        sync: false

  - type: web
    name: plataforma-mx
    runtime: node
    plan: free
    region: oregon
    branch: plataforma-mx
    rootDir: plataforma-mx/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: BACKEND_URL        # URL pública del servicio plataforma-mx-api (ajústela si Render le asignó otra)
        value: https://plataforma-mx-api.onrender.com
